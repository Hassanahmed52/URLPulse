<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor — URLPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen text-white">
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <a href="/" class="text-gray-400 hover:text-white transition text-sm">← Back</a>
            <h1 class="text-xl font-bold text-indigo-400">🔍 URLPulse</h1>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-gray-400 text-sm">Hello, <span id="username" class="text-white font-medium"></span></span>
            <button id="logoutBtn" class="px-4 py-1.5 bg-red-600 hover:bg-red-700 text-white text-sm rounded-lg transition">Logout</button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-8">
        <!-- Monitor Header -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 mb-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <h2 id="monitorName" class="text-2xl font-bold text-white">Loading...</h2>
                    <a id="monitorUrl" href="#" target="_blank"
                        class="text-indigo-400 hover:underline text-sm mt-1 block"></a>
                    <p id="monitorInterval" class="text-gray-500 text-xs mt-1"></p>
                </div>
                <span id="currentStatus" class="px-4 py-2 rounded-full text-sm font-bold bg-gray-700 text-gray-300">
                    Loading...
                </span>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="bg-gray-800 rounded-xl border border-gray-700 p-5">
                <p class="text-gray-400 text-sm mb-1">Uptime (24h)</p>
                <p id="uptimeStat" class="text-2xl font-bold text-white">—</p>
            </div>
            <div class="bg-gray-800 rounded-xl border border-gray-700 p-5">
                <p class="text-gray-400 text-sm mb-1">Checks (24h)</p>
                <p id="totalChecksStat" class="text-2xl font-bold text-indigo-400">—</p>
            </div>
            <div class="bg-gray-800 rounded-xl border border-gray-700 p-5">
                <p class="text-gray-400 text-sm mb-1">Avg Response</p>
                <p id="avgResponseStat" class="text-2xl font-bold text-green-400">—</p>
            </div>
        </div>

        <!-- Recent Checks -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-white">Recent Checks</h3>
                <span class="text-xs text-gray-500">Auto-refreshes every 30s</span>
            </div>
            <table class="w-full text-sm">
                <thead class="border-b border-gray-700">
                    <tr>
                        <th class="text-left py-3 px-4 text-gray-400 font-medium">Time</th>
                        <th class="text-left py-3 px-4 text-gray-400 font-medium">Status</th>
                        <th class="text-left py-3 px-4 text-gray-400 font-medium">Code / Error</th>
                        <th class="text-left py-3 px-4 text-gray-400 font-medium">Response Time</th>
                    </tr>
                </thead>
                <tbody id="checksTableBody">
                    <tr><td colspan="4" class="text-center py-8 text-gray-400">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <script type="module" src="/js/monitor.js"></script>
</body>
</html>
