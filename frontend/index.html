<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URLPulse — Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen text-white">
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-indigo-400">🔍 URLPulse</h1>
        <div class="flex items-center gap-4">
            <span class="text-gray-400 text-sm">Hello, <span id="username" class="text-white font-medium"></span></span>
            <button id="logoutBtn" class="px-4 py-1.5 bg-red-600 hover:bg-red-700 text-white text-sm rounded-lg transition">Logout</button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-8">
        <!-- Add Monitor Form -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 mb-8">
            <h2 class="text-lg font-semibold text-white mb-4">Add Monitor</h2>
            <div id="formError" class="hidden bg-red-900 border border-red-700 text-red-300 px-4 py-2 rounded-lg mb-4 text-sm"></div>
            <form id="addMonitorForm" class="flex flex-col sm:flex-row gap-3">
                <input id="monitorName" type="text" required placeholder="Name (e.g. My Blog)"
                    class="flex-1 bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-gray-500">
                <input id="monitorUrl" type="url" required placeholder="https://example.com"
                    class="flex-1 bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-gray-500">
                <select id="monitorInterval"
                    class="bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="30">Every 30s</option>
                    <option value="60" selected>Every 1m</option>
                    <option value="300">Every 5m</option>
                    <option value="600">Every 10m</option>
                </select>
                <button type="submit"
                    class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition whitespace-nowrap">
                    + Add
                </button>
            </form>
        </div>

        <!-- Monitors Table -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-white">Your Monitors</h2>
                <span class="text-xs text-gray-500">Auto-refreshes every 30s</span>
            </div>
            <table class="w-full text-sm">
                <thead class="border-b border-gray-700">
                    <tr>
                        <th class="text-left py-3 px-4 text-gray-400 font-medium">Monitor</th>
                        <th class="text-left py-3 px-4 text-gray-400 font-medium">Status</th>
                        <th class="text-left py-3 px-4 text-gray-400 font-medium">Uptime 24h</th>
                        <th class="text-left py-3 px-4 text-gray-400 font-medium">Last Checked</th>
                        <th class="text-left py-3 px-4 text-gray-400 font-medium">Actions</th>
                    </tr>
                </thead>
                <tbody id="monitorTableBody">
                    <tr><td colspan="5" class="text-center py-8 text-gray-400">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <script type="module" src="/js/index.js"></script>
</body>
</html>
